apiVersion: v1
kind: Pod
metadata:
  name: mac-test-pod
  namespace: eas-dev
  labels:
    app: mac-test
spec:
  initContainers:
  - name: change-mac
    image: alpine
    command: ["/bin/sh", "-c"]
    # Replace '02:42:AC:11:00:02' with your desired MAC address
    args:
    - |
      ip link set eth0 down &&
      ip link set eth0 address 02:42:AC:11:00:02 &&
      ip link set eth0 up
    securityContext:
      privileged: true  # Required to modify network interfaces
  containers:
  - name: main-container
    image: nginx:alpine
    ports:
    - containerPort: 80
