apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-application
  namespace: eas-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: eas-dev
spec:
  selector:
    app: web
  ports:
  - port: 80
  type: ClusterIP
