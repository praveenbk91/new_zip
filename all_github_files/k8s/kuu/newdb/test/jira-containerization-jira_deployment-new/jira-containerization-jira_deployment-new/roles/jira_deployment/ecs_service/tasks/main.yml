---
- name: Register ECS Task Definition for Jira
  ecs_taskdefinition:
    family: "{{ ecs_task_family }}"
    cpu: "{{ task_cpu }}"
    memory: "{{ task_memory }}"
    launch_type: "EC2"
    execution_role_arn: "{{ task_execution_role }}"
    task_role_arn: "{{ task_role }}"
    containers:
      - name: "{{ container_name }}"
        image: "{{ ecr_image_uri }}"
        cpu: "{{ task_cpu }}"
        memory: "{{ task_memory }}"
        essential: true
        portMappings:
          - containerPort: 8080
            hostPort: 8080
            protocol: tcp
        mountPoints:
          - containerPath: /var/atlassian/application-data/jira
            sourceVolume: "{{ efs_name }}"
            readOnly: false
        logConfiguration:
          logDriver: awslogs
          options:
            awslogs-group: "logs/poc-ecsjira"
            awslogs-region: "{{ aws_region }}"
            awslogs-stream-prefix: ecs
    region: "{{ aws_region }}"
    state: present
    volumes:
      - name: "{{ efs_name }}"
        efsVolumeConfiguration:
          fileSystemId: "{{ efs_id }}"
          rootDirectory: "/"
          transitEncryption: "ENABLED"
  register: task_def  # Capture the task definition

- name: Set the task_definition_arn variable
  set_fact:
    task_definition_arn: "{{ task_def.taskdefinition.taskDefinitionArn }}"
  when: task_def is defined and task_def.taskdefinition is defined and task_def.taskdefinition.taskDefinitionArn is defined

- name: Create or Update ECS Service for Jira
  ecs_service:
    name: "{{ ecs_service_name }}"
    cluster: "{{ ecs_cluster_name }}"
    task_definition: "{{ task_definition_arn }}"  # Use the captured ARN
    desired_count: "{{ desired_task_count }}"
    launch_type: "EC2"
    scheduling_strategy: "REPLICA"
    deployment_configuration:
      maximumPercent: 200
      minimumHealthyPercent: 100
    region: "{{ aws_region }}"
    load_balancers:
      - targetGroupArn: "{{ target_group_arn }}"
        containerName: "jira-container-new"
        containerPort: 8080
    state: present
  register: ecs_service  # Register ECS service details

- name: Wait for ECS Service to stabilize
  command: >
    /usr/local/bin/aws ecs describe-services
    --cluster {{ ecs_cluster_name }}
    --services {{ ecs_service_name }}
    --region {{ aws_region }}
  register: ecs_service_status

- name: Parse ECS service details from JSON
  set_fact:
    ecs_service_parsed: "{{ ecs_service_status.stdout | from_json }}"

- name: Output ECS Service Status
  debug:
    msg: "ECS Service status is: {{ ecs_service_parsed.services[0].status }}"
