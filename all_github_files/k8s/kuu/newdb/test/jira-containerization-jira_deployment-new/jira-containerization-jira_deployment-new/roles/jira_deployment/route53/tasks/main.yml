---
- name: Create DNS Record for ALB
  route53:
    state: present
    zone: "{{ route53_zone_id }}"  # Hosted zone ID for the domain
    record:
      name: "{{ domain_name }}"  # e.g. jira.yourdomain.com
      type: A
      alias:
        name: "{{ alb_dns_name}}"
        zone_id: "{{ alb_hosted_zone_id }}"
        evaluate_target_health: false
    region: "{{ aws_region }}"
