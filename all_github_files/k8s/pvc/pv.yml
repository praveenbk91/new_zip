apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-shared-vol-pv-new
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: efs-pv
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: 10.231.17.180::fsap-0c0c8a92e00bb95ed  # FS-ID::AP-ID for /confluence-shared root
