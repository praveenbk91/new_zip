---
- name: Register ECS Task Definition for Confluence
  ecs_taskdefinition:
    family: "{{ ecs_task_family }}"
    cpu: "2048"  # 2 vCPUs for the task
    memory: "4096"  # 4 GB RAM for the task
    launch_type: "EC2"
    execution_role_arn: "{{ task_execution_role }}"
    task_role_arn: "{{ task_role }}"
    containers:
      - name: "{{ container_name }}"
        image: "{{ ecr_image_uri }}"
        cpu: 2048  # 2 vCPUs for the container
        memory: 4096  # 4 GB RAM for the container
        essential: true
        portMappings:
          - containerPort: 8090
            hostPort: 0  # Use dynamic host port for multiple containers on the same instance
            protocol: tcp
        command:
          - "/bin/sh"
          - "-c"
          - "mkdir -p /var/atlassian/application-data/confluence && (cp /mnt/efs/confluence-config/confluence.cfg.xml /var/atlassian/application-data/confluence/confluence.cfg.xml || echo 'Warning: confluence.cfg.xml not found in EFS. Ensure it is pre-populated in EFS.') && /entrypoint.py"
        environment:
          - name: "JVM_MAXIMUM_MEMORY"
            value: "2048m"
          - name: "JVM_MINIMUM_MEMORY"
            value: "1024m"
          - name: "ATL_SHARED_HOME"
            value: "/mnt/efs/confluence-shared"
          - name: "ATL_CLUSTER_NAME"
            value: "confluence-cluster"
          - name: "ATL_HAZELCAST_NETWORK_LOCAL"
            value: "true"
          - name: "ATL_HAZELCAST_PORT"
            value: "5801"
        mountPoints:
          - containerPath: "/mnt/efs/confluence-shared"
            sourceVolume: "confluence-efs-shared"
            readOnly: false
          - containerPath: "/mnt/efs/confluence-config"
            sourceVolume: "confluence-efs-config"
            readOnly: false
        logConfiguration:
          logDriver: awslogs
          options:
            awslogs-group: "logs/poc-ecsconfluencenew"
            awslogs-region: "{{ aws_region }}"
            awslogs-stream-prefix: "ecs"
    region: "{{ aws_region }}"
    state: present
    volumes:
      - name: "confluence-efs-shared"
        efsVolumeConfiguration:
          fileSystemId: "{{ efs_id }}"
          rootDirectory: "/confluence-shared"
          transitEncryption: "ENABLED"
      - name: "confluence-efs-config"
        efsVolumeConfiguration:
          fileSystemId: "{{ efs_id }}"
          rootDirectory: "/confluence-config"
          transitEncryption: "ENABLED"
  register: task_def  # Capture the task definition

- name: Set the task_definition_arn variable
  set_fact:
    task_definition_arn: "{{ task_def.taskdefinition.taskDefinitionArn }}"
  when: task_def is defined and task_def.taskdefinition is defined and task_def.taskdefinition.taskDefinitionArn is defined

- name: Create or Update ECS Service for Confluence
  ecs_service:
    name: "{{ ecs_service_name }}"
    cluster: "{{ ecs_cluster_name }}"
    task_definition: "{{ task_definition_arn }}"  # Use the captured ARN
    desired_count: "{{ desired_task_count }}"  # Set to 2 or 3 based on cluster size
    launch_type: "EC2"
    scheduling_strategy: "REPLICA"
    deployment_configuration:
      maximumPercent: 200
      minimumHealthyPercent: 0
    region: "{{ aws_region }}"
    load_balancers:
      - targetGroupArn: "{{ target_group_arn }}"
        containerName: "{{ container_name }}"
        containerPort: 8090
    state: present
  register: ecs_service  # Register ECS service details

- name: Wait for ECS Service to stabilize
  command: >
    aws ecs describe-services
    --cluster {{ ecs_cluster_name }}
    --services {{ ecs_service_name }}
    --region {{ aws_region }}
  register: ecs_service_status
  until: "'RUNNING' in ecs_service_status.stdout and 'PENDING' not in ecs_service_status.stdout"
  retries: 30
  delay: 10

- name: Parse ECS service details from JSON
  set_fact:
    ecs_service_parsed: "{{ ecs_service_status.stdout | from_json }}"

- name: Output ECS Service Status
  debug:
    msg: "ECS Service status is: {{ ecs_service_parsed.services[0].status }}"
